<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>买家端 · Shop商城</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f5f5; color:#333; }
  a { text-decoration:none; color:inherit; }
  button { cursor:pointer; font-family:inherit; }
  /* 顶栏 */
  .topbar { background:#fff; border-bottom:1px solid #eee; }
  .topbar-in { max-width:1100px; margin:0 auto; height:60px; display:flex; align-items:center; padding:0 20px; }
  .logo { font-size:20px; font-weight:700; color:#ff5000; margin-right:30px; }
  .logo span { color:#333; font-size:13px; font-weight:400; }
  .nav { display:flex; gap:22px; font-size:14px; color:#555; }
  .nav a.active { color:#ff5000; font-weight:600; }
  .user { margin-left:auto; font-size:13px; color:#666; }
  .user b { color:#ff5000; }
  /* 内容 */
  .container { max-width:1100px; margin:20px auto; padding:0 20px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .pcard { background:#fff; border-radius:8px; overflow:hidden; cursor:pointer; transition:.2s; border:1px solid #f0f0f0; }
  .pcard:hover { box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-2px); }
  .pimg { height:150px; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; letter-spacing:1px; }
  .pbody { padding:12px; }
  .pname { font-size:14px; line-height:1.5; height:42px; overflow:hidden; }
  .pprice { color:#ff5000; font-size:18px; font-weight:700; margin:8px 0; }
  .pprice i { font-style:normal; font-size:12px; }
  .pstock { font-size:12px; color:#999; }
  .pstock b { color:#ff5000; }
  .buybtn { display:block; margin-top:10px; background:#ff5000; color:#fff; text-align:center; padding:8px 0; border-radius:4px; font-size:14px; }
  /* 通用卡片/面板 */
  .panel { background:#fff; border-radius:8px; padding:20px; margin-bottom:16px; }
  .h2 { font-size:16px; font-weight:600; margin-bottom:14px; padding-left:10px; border-left:4px solid #ff5000; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:12px 10px; border-bottom:1px solid #f2f2f2; }
  th { color:#888; font-weight:500; background:#fafafa; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
  .t-pay { background:#fff3e0; color:#ff9800; }
  .t-ship { background:#e8f3ff; color:#409eff; }
  .t-refund { background:#f3e8ff; color:#9c27b0; }
  .t-done { background:#e8f8ee; color:#67c23a; }
  .t-close { background:#f0f0f0; color:#909399; }
  .t-err { background:#ffecec; color:#f56c6c; }
  .btn { display:inline-block; padding:6px 14px; border-radius:4px; font-size:13px; border:none; }
  .btn-orange { background:#ff5000; color:#fff; }
  .btn-line { background:#fff; color:#666; border:1px solid #ddd; }
  .btn-blue { background:#409eff; color:#fff; }
  .btn-red { background:#f56c6c; color:#fff; }
  .btn-gray { background:#f0f0f0; color:#999; cursor:not-allowed; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  /* 详情 */
  .detail-top { display:flex; gap:20px; }
  .dimg { width:260px; height:260px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; }
  .dinfo { flex:1; }
  .dname { font-size:20px; font-weight:600; }
  .dprice { color:#ff5000; font-size:26px; font-weight:700; margin:14px 0; }
  .dstock { font-size:13px; color:#666; margin-bottom:16px; }
  .qty { display:flex; align-items:center; gap:0; margin-bottom:16px; }
  .qty button { width:32px; height:32px; border:1px solid #ddd; background:#fff; font-size:16px; }
  .qty input { width:48px; height:32px; border:1px solid #ddd; text-align:center; border-left:0; border-right:0; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; color:#666; margin-bottom:6px; }
  .field input,.field textarea,.field select { width:100%; padding:9px 10px; border:1px solid #ddd; border-radius:4px; font-size:14px; font-family:inherit; }
  .field textarea { height:80px; resize:none; }
  .sum-line { display:flex; justify-content:space-between; font-size:14px; padding:6px 0; }
  .sum-line.total { font-size:16px; font-weight:700; color:#ff5000; border-top:1px dashed #eee; margin-top:8px; padding-top:12px; }
  .back { font-size:13px; color:#409eff; margin-bottom:12px; display:inline-block; }
  .tip { font-size:12px; color:#b06b2a; background:#fff8f0; border:1px solid #ffd9b3; padding:8px 12px; border-radius:6px; margin:10px 0; line-height:1.7; }
  .info-box { background:#fafafa; border:1px solid #f0f0f0; border-radius:6px; padding:14px; font-size:13px; line-height:2; }
  .info-box b { color:#333; }
  .kv { display:flex; }
  .kv .k { width:90px; color:#999; }
  .kv .v { flex:1; }
  .toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.82); color:#fff; padding:10px 20px; border-radius:6px; font-size:14px; z-index:999; display:none; }
  .qrcode { width:180px; height:180px; margin:20px auto; background:#fff; border:1px solid #eee; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#999; flex-direction:column; gap:8px; }
  .pay-title { text-align:center; font-size:16px; font-weight:600; }
  .pay-amt { text-align:center; color:#ff5000; font-size:28px; font-weight:700; margin:6px 0; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="logo">Shop商城 <span>题目01原型</span></div>
    <div class="nav">
      <a href="javascript:void(0)" onclick="goHome()">首页</a>
      <a href="javascript:void(0)" onclick="goOrders()">我的订单</a>
      <a href="../index.html">返回原型入口</a>
    </div>
    <div class="user">买家：<b>张三</b>（已登录·JWT）</div>
  </div>
</div>
<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ===== mock 数据 =====
const products = [
  { id:1, name:"XX 品牌无线蓝牙耳机（标准款）", price:10000, stock:5, color:"#5b8def" },
  { id:2, name:"YY 便携式蓝牙音箱", price:8000, stock:10, color:"#43b883" }
];

// 订单：覆盖全部状态用于演示
let orders = [
  { id:"T0120261115001", pid:1, name:"XX 品牌无线蓝牙耳机（标准款）", qty:1, amount:10000, status:"待付款", createdAt:"2026-11-15 10:12", carrier:"", tracking:"" },
  { id:"T0120261115002", pid:1, name:"XX 品牌无线蓝牙耳机（标准款）", qty:2, amount:20000, status:"待发货", createdAt:"2026-11-15 09:40", carrier:"", tracking:"" },
  { id:"T0120261115003", pid:2, name:"YY 便携式蓝牙音箱", qty:1, amount:8000, status:"退款申请中", createdAt:"2026-11-15 09:10", carrier:"", tracking:"" },
  { id:"T0120261115004", pid:1, name:"XX 品牌无线蓝牙耳机（标准款）", qty:1, amount:10000, status:"退款失败", createdAt:"2026-11-14 20:30", carrier:"", tracking:"" },
  { id:"T0120261115005", pid:2, name:"YY 便携式蓝牙音箱", qty:2, amount:16000, status:"已退款", createdAt:"2026-11-14 18:00", carrier:"", tracking:"" },
  { id:"T0120261115006", pid:1, name:"XX 品牌无线蓝牙耳机（标准款）", qty:1, amount:10000, status:"已发货", createdAt:"2026-11-14 15:20", carrier:"顺丰速运", tracking:"SF1234567890" },
  { id:"T0120261115007", pid:1, name:"XX 品牌无线蓝牙耳机（标准款）", qty:1, amount:10000, status:"已关闭", createdAt:"2026-11-14 14:00", carrier:"", tracking:"" },
  { id:"T0120261115008", pid:1, name:"XX 品牌无线蓝牙耳机（标准款）", qty:1, amount:10000, status:"支付异常", createdAt:"2026-11-14 13:30", carrier:"", tracking:"" }
];

let cart = { pid:null, qty:1 }; // 待结算商品

const statusTag = {
  "待付款":"t-pay","待发货":"t-ship","退款申请中":"t-refund","退款处理中":"t-refund",
  "退款失败":"t-refund","已退款":"t-done","已发货":"t-done","已关闭":"t-close","支付异常":"t-err"
};
const fen2yuan = p => (p/100).toFixed(2);

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2200); }

// ===== 视图 =====
function goHome(){ renderHome(); }
function goOrders(){ renderOrders(); }

function renderHome(){
  const app=document.getElementById('app');
  app.innerHTML = `<div class="panel"><div class="h2">在售商品</div>
    <div class="grid">` +
    products.map(p=>`
      <div class="pcard" onclick="goDetail(${p.id})">
        <div class="pimg" style="background:${p.color}">商品主图（演示）</div>
        <div class="pbody">
          <div class="pname">${p.name}</div>
          <div class="pprice"><i>¥</i>${fen2yuan(p.price)}</div>
          <div class="pstock">可售数量：<b>${p.stock}</b> 件</div>
          <span class="buybtn">立即购买</span>
        </div>
      </div>`).join('') +
    `</div></div>`;
}

function goDetail(pid){
  const p=products.find(x=>x.id===pid);
  cart = { pid:pid, qty:1 };
  const app=document.getElementById('app');
  app.innerHTML = `
  <div class="panel"><span class="back" onclick="goHome()">← 返回商品列表</span>
    <div class="detail-top">
      <div class="dimg" style="background:${p.color}">商品主图（演示）</div>
      <div class="dinfo">
        <div class="dname">${p.name}</div>
        <div class="dprice">¥${fen2yuan(p.price)}</div>
        <div class="dstock">可售数量：<b style="color:#ff5000">${p.stock}</b> 件（下单即占用库存，未付款 10 分钟释放）</div>
        <div class="qty">购买数量：
          <button onclick="qtyChange(-1)">−</button>
          <input id="qtyInput" value="1" readonly>
          <button onclick="qtyChange(1)">+</button>
          <span style="margin-left:10px;font-size:12px;color:#999">每单限 1～2 件</span>
        </div>
        <div class="tip">商品A 本次仅剩 ${products[0].stock} 件，多买家并发抢购可能库存不足，正式系统以服务端占用为准。</div>
        <button class="btn btn-orange" style="padding:10px 40px;font-size:15px" onclick="goCheckout()">立即购买</button>
      </div>
    </div>
  </div>`;
}
function qtyChange(d){ cart.qty=Math.min(2,Math.max(1,cart.qty+d)); document.getElementById('qtyInput').value=cart.qty; }

function goCheckout(){
  const p=products.find(x=>x.id===cart.pid);
  const app=document.getElementById('app');
  app.innerHTML = `
  <div class="panel"><span class="back" onclick="goDetail(${p.id})">← 返回</span>
    <div class="h2">确认订单</div>
    <table>
      <tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr>
      <tr><td>${p.name}</td><td>¥${fen2yuan(p.price)}</td><td>${cart.qty}</td><td>¥${fen2yuan(p.price*cart.qty)}</td></tr>
    </table>
    <div class="sum-line" style="margin-top:14px"><span>应付金额（不含运费/优惠）</span><span class="total">¥${fen2yuan(p.price*cart.qty)}</span></div>
    <div class="tip">提交订单将占用库存，请于 <b>10 分钟</b>内完成支付，超时自动关闭并释放库存。</div>
    <div style="margin-top:14px">
      <button class="btn btn-line" onclick="goDetail(${p.id})">取消</button>
      <button class="btn btn-orange" onclick="submitOrder()">提交订单</button>
    </div>
  </div>`;
}

function submitOrder(){
  const p=products.find(x=>x.id===cart.pid);
  if(cart.qty>p.stock){ toast("库存不足，下单失败！"); return; }
  const now=new Date();
  const id="T01"+now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+String(orders.length+1).padStart(3,'0');
  const order={ id, pid:p.id, name:p.name, qty:cart.qty, amount:p.price*cart.qty, status:"待付款",
    createdAt:now.toLocaleString('zh-CN',{hour12:false}), carrier:"", tracking:"" };
  orders.unshift(order);
  p.stock-=cart.qty;
  toast("订单已创建，占用库存，请尽快支付");
  renderPay(order.id);
}

function renderPay(oid){
  const o=orders.find(x=>x.id===oid);
  const app=document.getElementById('app');
  app.innerHTML = `
  <div class="panel" style="max-width:460px;margin:40px auto;text-align:center">
    <div class="pay-title">支付宝沙箱收银台（演示）</div>
    <div class="pay-amt">¥${fen2yuan(o.amount)}</div>
    <div style="font-size:13px;color:#666">订单号：${o.id}</div>
    <div class="qrcode"><div style="font-size:22px">▣</div><div>扫码付款示意</div><div style="font-size:11px">openapi-sandbox.dl.alipaydev.com</div></div>
    <div class="tip">正式系统：跳转支付宝沙箱真实收银台完成付款，服务端收到异步通知验签后改变订单状态。</div>
    <button class="btn btn-blue" style="padding:10px 40px" onclick="paySuccess('${o.id}')">我已付款（模拟回调成功）</button>
    <div style="margin-top:10px"><button class="btn btn-line" onclick="goOrders()">暂不支付，稍后再付</button></div>
  </div>`;
}
function paySuccess(oid){
  const o=orders.find(x=>x.id===oid);
  if(o.status==="待付款"){ o.status="待发货"; toast("支付成功通知已验签，订单已更新为【待发货】"); }
  else if(o.status==="待发货"){ toast("重复通知已幂等忽略，不重复记款"); }
  renderOrderDetail(oid);
}

function renderOrders(){
  const app=document.getElementById('app');
  app.innerHTML = `<div class="panel"><div class="h2">我的订单</div>
    <div class="tip">演示覆盖全部状态：待付款 / 待发货 / 退款申请中 / 退款失败 / 已退款 / 已发货 / 已关闭 / 支付异常。点击订单查看详情。</div>
    <table>
      <tr><th>订单号</th><th>商品</th><th>数量</th><th>金额</th><th>状态</th><th>下单时间</th><th>操作</th></tr>
      ${orders.map(o=>`
        <tr>
          <td>${o.id}</td><td>${o.name}</td><td>${o.qty}</td><td>¥${fen2yuan(o.amount)}</td>
          <td><span class="tag ${statusTag[o.status]}">${o.status}</span></td>
          <td>${o.createdAt}</td>
          <td><button class="btn btn-line" onclick="renderOrderDetail('${o.id}')">详情</button></td>
        </tr>`).join('')}
    </table></div>`;
}

function renderOrderDetail(oid){
  const o=orders.find(x=>x.id===oid);
  const app=document.getElementById('app');
  let action="";
  if(o.status==="待付款") action = `<button class="btn btn-orange" onclick="renderPay('${o.id}')">去支付</button>
    <button class="btn btn-line" onclick="cancelOrder('${o.id}')">取消订单</button>`;
  else if(o.status==="待发货") action = `<button class="btn btn-red" onclick="goRefund('${o.id}')">申请退款</button>`;
  else if(o.status==="已发货") action = `<span class="tag t-done">运单：${o.carrier} ${o.tracking}</span>`;
  else if(o.status==="退款申请中") action = `<span class="tag t-refund">待客服审核，发货已暂停</span>`;
  else if(o.status==="退款失败") action = `<span class="tag t-refund">退款失败，客服跟进重试中</span>`;
  else if(o.status==="已退款") action = `<span class="tag t-done">退款成功，库存已恢复</span>`;
  else if(o.status==="已关闭") action = `<span class="tag t-close">已关闭，库存已释放</span>`;
  else if(o.status==="支付异常") action = `<span class="tag t-err">超时关闭后收到支付，已转异常待客服退款</span>`;

  app.innerHTML = `
  <div class="panel"><span class="back" onclick="goOrders()">← 返回订单列表</span>
    <div class="h2">订单详情　<span class="tag ${statusTag[o.status]}">${o.status}</span></div>
    <div class="info-box">
      <div class="kv"><span class="k">订单号</span><span class="v">${o.id}</span></div>
      <div class="kv"><span class="k">商品</span><span class="v">${o.name}</span></div>
      <div class="kv"><span class="k">数量</span><span class="v">${o.qty} 件</span></div>
      <div class="kv"><span class="k">金额</span><span class="v">¥${fen2yuan(o.amount)}（下单时价格快照）</span></div>
      <div class="kv"><span class="k">下单时间</span><span class="v">${o.createdAt}</span></div>
      ${o.carrier ? `<div class="kv"><span class="k">运单</span><span class="v">${o.carrier} / ${o.tracking}</span></div>`:""}
    </div>
    <div style="margin-top:16px">${action}</div>
  </div>`;
}

function cancelOrder(oid){
  const o=orders.find(x=>x.id===oid);
  if(o.status==="待付款"){
    o.status="已关闭";
    const p=products.find(x=>x.id===o.pid);
    if(p) p.stock+=o.qty;
    toast("订单已取消，库存已释放");
  } else toast("当前状态不可取消");
  renderOrderDetail(oid);
}

function goRefund(oid){
  const o=orders.find(x=>x.id===oid);
  const app=document.getElementById('app');
  app.innerHTML = `
  <div class="panel" style="max-width:520px"><span class="back" onclick="renderOrderDetail('${oid}')">← 返回</span>
    <div class="h2">申请售前退款</div>
    <div class="info-box" style="margin-bottom:14px">
      订单 ${o.id} · ${o.name} ×${o.qty} · ¥${fen2yuan(o.amount)}
    </div>
    <div class="field"><label>退款原因（整单退款）</label>
      <textarea id="refundReason" placeholder="请填写退款原因，供客服审核"></textarea></div>
    <div class="tip">申请期间订单暂停发货；客服同意并经渠道退款成功后，售前退款将恢复对应可售数量。</div>
    <button class="btn btn-red" onclick="submitRefund('${oid}')">提交退款申请</button>
  </div>`;
}
function submitRefund(oid){
  const o=orders.find(x=>x.id===oid);
  o.status="退款申请中";
  toast("退款申请已提交，进入待客服审核");
  renderOrderDetail(oid);
}

// 初始化
renderHome();
</script>
</body>
</html>
