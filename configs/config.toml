# 题目01 电商订单交易系统 - 主配置（可提交，敏感值留空，由 config.local.toml 覆盖）

[server]
addr = ":8080"

[mysql]
host = "127.0.0.1"
port = 3306
user = "root"
password = ""          # 在 config.local.toml 覆盖
dbname = "shop_t01"
max_open_conns = 20
max_idle_conns = 5

[redis]
addr = "127.0.0.1:6379"
password = ""
db = 0

[alipay]
app_id = "9021000164619685"
gateway = "https://openapi-sandbox.dl.alipaydev.com/gateway.do"
notify_url = "http://6d45d8a5.r11.cpolar.top/pay/notify"
private_key = ""       # 在 config.local.toml 覆盖
alipay_public_key = "" # 在 config.local.toml 覆盖

[clock]
# 待付款超时时长（教学演示可缩短，测试与演示同规则）
pending_ttl = "10m"

[refund]
# 渠道退款模拟：true 表示首次退款失败（演示"首次失败、重试成功"），false 一次成功
fail_first_attempt = false

[jwt]
# JWT 签名密钥（教学演示值，生产须更换）
secret = "demo-secret-change-me"
